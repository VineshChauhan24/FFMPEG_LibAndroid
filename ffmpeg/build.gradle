plugins {
    alias(libs.plugins.android.application)
    id 'maven-publish'
}

android {
    namespace 'com.arthenica.ffmpegkit'
    compileSdk 35

    defaultConfig {
        applicationId "com.arthenica.ffmpegkit"
        minSdk 24
        targetSdk 35
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    sourceSets {
        main {
            jniLibs.srcDirs = ['libs']
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

publishing {
    publications {
        release(MavenPublication) { // The problem is here!
            groupId = 'com.github.VineshChauhan24' // Important: Set your group ID
            artifactId = 'FFMPEG_LibAndroid' // Important: Set your artifact ID
            version = 'v1.0.0' // Important: Set your version

            // Component to publish (very important!)
//            from components.java // Or components.web, or whatever your component is

            // Optional: Customize the POM
            pom {
                // ... pom customizations ...
            }
        }
    }
}

dependencies {

    implementation libs.appcompat
    implementation libs.material
    implementation libs.activity
    implementation libs.constraintlayout
    testImplementation libs.junit
    androidTestImplementation libs.ext.junit
    androidTestImplementation libs.espresso.core
}